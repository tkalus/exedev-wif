name: Create Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New tag (e.g. v1.2)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Get Octo STS token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: sts
        with:
          scope: ${{ github.repository }}
          identity: create-tag

      - name: Create tag
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git check-ref-format "refs/tags/$TAG"

          gh api \
            --method POST \
            "repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA"
